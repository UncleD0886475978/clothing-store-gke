# EXAMPLE ONLY — demo credentials for local learning.
# Change the passwords before applying anywhere you care about, or create
# the secret directly without storing it in a file:
#
#   kubectl -n threads create secret generic mysql-secret \
#     --from-literal=MYSQL_DATABASE=threads_store \
#     --from-literal=MYSQL_USER=threads \
#     --from-literal=MYSQL_PASSWORD='<redacted>' \
#     --from-literal=MYSQL_ROOT_PASSWORD='<redacted>'
#
# setup.sh deploy applies this example ONLY if no mysql-secret exists
# yet in the threads namespace, and prints a warning when it does.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: threads
  labels:
    app: mysql
    app.kubernetes.io/part-of: threads-store
type: Opaque
stringData:
  MYSQL_DATABASE: threads_store
  MYSQL_USER: threads
  MYSQL_PASSWORD: threads_change_me
  MYSQL_ROOT_PASSWORD: threads_root_change_me
