# Threads & Co. — core database schema (MySQL 8)
# Mounted into the MySQL StatefulSet at /docker-entrypoint-initdb.d/01-schema.sql
# (see mysql-schema-configmap.yaml). The MySQL entrypoint runs init scripts
# against $MYSQL_DATABASE (threads_store) on FIRST start with an empty data
# directory only. Table design lives in the clothing-store-database repo;
# this is the same core schema, kept compact.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-schema
  namespace: threads
  labels:
    app: mysql
    app.kubernetes.io/part-of: threads-store
data:
  schema.sql: |
    -- Threads & Co. core schema — sample/demo schema, valid MySQL 8.
    CREATE TABLE IF NOT EXISTS categories (
      id INT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
      name VARCHAR(100) NOT NULL UNIQUE,
      slug VARCHAR(120) NOT NULL UNIQUE,
      parent_id INT UNSIGNED NULL,
      created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
      CONSTRAINT fk_categories_parent FOREIGN KEY (parent_id) REFERENCES categories (id)
    ) ENGINE=InnoDB;

    CREATE TABLE IF NOT EXISTS products (
      id INT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
      category_id INT UNSIGNED NOT NULL,
      name VARCHAR(200) NOT NULL,
      slug VARCHAR(220) NOT NULL UNIQUE,
      description TEXT NULL,
      base_price DECIMAL(10,2) NOT NULL,
      active TINYINT(1) NOT NULL DEFAULT 1,
      created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
      updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
      CONSTRAINT fk_products_category FOREIGN KEY (category_id) REFERENCES categories (id)
    ) ENGINE=InnoDB;

    CREATE TABLE IF NOT EXISTS product_variants (
      id INT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
      product_id INT UNSIGNED NOT NULL,
      sku VARCHAR(64) NOT NULL UNIQUE,
      size VARCHAR(20) NULL,
      color VARCHAR(50) NULL,
      price_delta DECIMAL(10,2) NOT NULL DEFAULT 0.00,
      CONSTRAINT fk_variants_product FOREIGN KEY (product_id) REFERENCES products (id) ON DELETE CASCADE
    ) ENGINE=InnoDB;

    CREATE TABLE IF NOT EXISTS inventory (
      variant_id INT UNSIGNED PRIMARY KEY,
      quantity INT NOT NULL DEFAULT 0,
      reserved INT NOT NULL DEFAULT 0,
      updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
      CONSTRAINT fk_inventory_variant FOREIGN KEY (variant_id) REFERENCES product_variants (id) ON DELETE CASCADE
    ) ENGINE=InnoDB;

    CREATE TABLE IF NOT EXISTS customers (
      id INT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
      first_name VARCHAR(80) NOT NULL,
      last_name VARCHAR(80) NOT NULL,
      email VARCHAR(190) NOT NULL UNIQUE,
      password_hash VARCHAR(255) NOT NULL,
      phone VARCHAR(40) NULL,
      created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
    ) ENGINE=InnoDB;

    CREATE TABLE IF NOT EXISTS orders (
      id INT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
      customer_id INT UNSIGNED NOT NULL,
      status VARCHAR(20) NOT NULL DEFAULT 'pending',
      subtotal DECIMAL(10,2) NOT NULL DEFAULT 0.00,
      tax DECIMAL(10,2) NOT NULL DEFAULT 0.00,
      shipping DECIMAL(10,2) NOT NULL DEFAULT 0.00,
      total DECIMAL(10,2) NOT NULL DEFAULT 0.00,
      placed_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
      CONSTRAINT fk_orders_customer FOREIGN KEY (customer_id) REFERENCES customers (id),
      INDEX idx_orders_customer (customer_id),
      INDEX idx_orders_placed (placed_at)
    ) ENGINE=InnoDB;

    CREATE TABLE IF NOT EXISTS order_items (
      id INT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
      order_id INT UNSIGNED NOT NULL,
      variant_id INT UNSIGNED NOT NULL,
      qty INT NOT NULL DEFAULT 1,
      unit_price DECIMAL(10,2) NOT NULL,
      CONSTRAINT fk_items_order FOREIGN KEY (order_id) REFERENCES orders (id) ON DELETE CASCADE,
      CONSTRAINT fk_items_variant FOREIGN KEY (variant_id) REFERENCES product_variants (id)
    ) ENGINE=InnoDB;

    CREATE TABLE IF NOT EXISTS payments (
      id INT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
      order_id INT UNSIGNED NOT NULL,
      method VARCHAR(30) NOT NULL,
      status VARCHAR(20) NOT NULL DEFAULT 'pending',
      amount DECIMAL(10,2) NOT NULL,
      transaction_ref VARCHAR(120) NULL,
      paid_at TIMESTAMP NULL,
      CONSTRAINT fk_payments_order FOREIGN KEY (order_id) REFERENCES orders (id) ON DELETE CASCADE
    ) ENGINE=InnoDB;

    CREATE TABLE IF NOT EXISTS promotions (
      id INT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
      code VARCHAR(40) NOT NULL UNIQUE,
      description VARCHAR(255) NULL,
      discount_percent DECIMAL(5,2) NOT NULL DEFAULT 0.00,
      starts_at TIMESTAMP NULL,
      ends_at TIMESTAMP NULL,
      active TINYINT(1) NOT NULL DEFAULT 1
    ) ENGINE=InnoDB;
